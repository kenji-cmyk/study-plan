spring.application.name=study-planner
# The repository-level .env file is kept outside backend after the project split.
# Spring Boot does not load .env files automatically, so import it explicitly.
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=study_planner;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.flyway.baseline-on-migrate=true
