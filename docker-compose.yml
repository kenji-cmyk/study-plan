services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StudyPlanner_Strong_Password1!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    environment:
      DB_USERNAME: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:-StudyPlanner_Strong_Password1!}
      SPRING_DATASOURCE_URL: jdbc:sqlserver://database:1433;databaseName=study_planner;encrypt=true;trustServerCertificate=true
    ports:
      - "8080:8080"
    depends_on:
      database-init:
        condition: service_completed_successfully

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-StudyPlanner_Strong_Password1!}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S database -U sa
        -P "$${MSSQL_SA_PASSWORD}" -C
        -Q "IF DB_ID('study_planner') IS NULL CREATE DATABASE study_planner"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlserver-data:
